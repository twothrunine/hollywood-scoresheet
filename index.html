<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gin Rummy">
    <meta name="theme-color" content="#171717">
    <title>Hollywood Gin Rummy Scoresheet</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23171717'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='120'>🃏</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        input[type="number"],
        input[type="text"] {
            font-size: 16px;
        }
        @supports (-webkit-touch-callout: none) {
            body {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Plus, Minus, RotateCcw, Settings } = lucide;

        const HollywoodGinScoresheet = () => {
          const [player1Name, setPlayer1Name] = useState(() => 
            localStorage.getItem('player1Name') || 'Player 1'
          );
          const [player2Name, setPlayer2Name] = useState(() => 
            localStorage.getItem('player2Name') || 'Player 2'
          );
          const [editingNames, setEditingNames] = useState(false);
          
          const [player1Balance, setPlayer1Balance] = useState(() => 
            parseFloat(localStorage.getItem('player1Balance')) || 0
          );
          const [player2Balance, setPlayer2Balance] = useState(() => 
            parseFloat(localStorage.getItem('player2Balance')) || 0
          );
          const [editingBalances, setEditingBalances] = useState(false);
          const [tempP1Balance, setTempP1Balance] = useState('0');
          const [tempP2Balance, setTempP2Balance] = useState('0');
          
          const [player1WinCount, setPlayer1WinCount] = useState(() => 
            parseInt(localStorage.getItem('player1WinCount')) || 0
          );
          const [player2WinCount, setPlayer2WinCount] = useState(() => 
            parseInt(localStorage.getItem('player2WinCount')) || 0
          );
          
          const [winningScore, setWinningScore] = useState(() => 
            parseInt(localStorage.getItem('winningScore')) || 100
          );
          const [gameValue, setGameValue] = useState(() => 
            parseFloat(localStorage.getItem('gameValue')) || 5.00
          );
          const [boxValue, setBoxValue] = useState(() => 
            parseFloat(localStorage.getItem('boxValue')) || 1.00
          );
          const [showSettings, setShowSettings] = useState(false);
          
          const [games, setGames] = useState(() => {
            const saved = localStorage.getItem('games');
            return saved ? JSON.parse(saved) : [
              { id: 1, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false },
              { id: 2, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false },
              { id: 3, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false }
            ];
          });
          
          const [handCount, setHandCount] = useState(() => 
            parseInt(localStorage.getItem('handCount')) || 0
          );
          const [scoreInput, setScoreInput] = useState('');
          const [selectedPlayer, setSelectedPlayer] = useState(1);
          const [lastWinner, setLastWinner] = useState(() => 
            parseInt(localStorage.getItem('lastWinner')) || null
          );

          useEffect(() => {
            localStorage.setItem('player1Name', player1Name);
            localStorage.setItem('player2Name', player2Name);
            localStorage.setItem('player1Balance', player1Balance);
            localStorage.setItem('player2Balance', player2Balance);
            localStorage.setItem('player1WinCount', player1WinCount);
            localStorage.setItem('player2WinCount', player2WinCount);
            localStorage.setItem('winningScore', winningScore);
            localStorage.setItem('gameValue', gameValue);
            localStorage.setItem('boxValue', boxValue);
            localStorage.setItem('games', JSON.stringify(games));
            localStorage.setItem('handCount', handCount);
            localStorage.setItem('lastWinner', lastWinner);
          }, [player1Name, player2Name, player1Balance, player2Balance, player1WinCount, 
              player2WinCount, winningScore, gameValue, boxValue, games, handCount, lastWinner]);

          const calculateBoxBonus = (winner, loser) => {
            const handDifference = winner.length - loser.length;
            return handDifference * boxValue;
          };

          const addScore = () => {
            const points = parseInt(scoreInput);
            if (!points || points < 0) return;

            const newHandCount = handCount + 1;
            setHandCount(newHandCount);
            setLastWinner(selectedPlayer);

            let newP1WinCount = player1WinCount;
            let newP2WinCount = player2WinCount;
            
            if (selectedPlayer === 1) {
              newP1WinCount++;
              setPlayer1WinCount(newP1WinCount);
            } else {
              newP2WinCount++;
              setPlayer2WinCount(newP2WinCount);
            }

            const newGames = games.map(game => {
              const gameNum = game.id;
              
              if (game.winner) return game;

              let shouldAddScore = false;
              if (selectedPlayer === 1) {
                if (gameNum === 1 && newP1WinCount >= 1) shouldAddScore = true;
                if (gameNum === 2 && newP1WinCount >= 2) shouldAddScore = true;
                if (gameNum === 3 && newP1WinCount >= 3) shouldAddScore = true;
              } else {
                if (gameNum === 1 && newP2WinCount >= 1) shouldAddScore = true;
                if (gameNum === 2 && newP2WinCount >= 2) shouldAddScore = true;
                if (gameNum === 3 && newP2WinCount >= 3) shouldAddScore = true;
              }

              if (shouldAddScore) {
                let newGame = { ...game };
                
                if (selectedPlayer === 1) {
                  const newP1Score = game.p1Score + points;
                  newGame = {
                    ...game,
                    p1Score: newP1Score,
                    p1Scores: [...game.p1Scores, points]
                  };
                  
                  if (newP1Score >= winningScore) {
                    const boxBonus = calculateBoxBonus(newGame.p1Scores, newGame.p2Scores);
                    const isShutout = newGame.p2Score === 0;
                    newGame.shutout = isShutout;
                    newGame.winner = 1;
                    
                    let gameMoney = gameValue + boxBonus;
                    if (isShutout) gameMoney *= 2;
                    
                    setPlayer1Balance(prev => prev + gameMoney);
                    setPlayer2Balance(prev => prev - gameMoney);
                  }
                } else {
                  const newP2Score = game.p2Score + points;
                  newGame = {
                    ...game,
                    p2Score: newP2Score,
                    p2Scores: [...game.p2Scores, points]
                  };
                  
                  if (newP2Score >= winningScore) {
                    const boxBonus = calculateBoxBonus(newGame.p2Scores, newGame.p1Scores);
                    const isShutout = newGame.p1Score === 0;
                    newGame.shutout = isShutout;
                    newGame.winner = 2;
                    
                    let gameMoney = gameValue + boxBonus;
                    if (isShutout) gameMoney *= 2;
                    
                    setPlayer2Balance(prev => prev + gameMoney);
                    setPlayer1Balance(prev => prev - gameMoney);
                  }
                }
                
                return newGame;
              }
              
              return game;
            });

            setGames(newGames);
            setScoreInput('');
          };

          const undoLastScore = () => {
            if (handCount === 0) return;

            const newHandCount = handCount - 1;
            setHandCount(newHandCount);
            
            if (newHandCount === 0) {
              setLastWinner(null);
            }

            let newP1WinCount = player1WinCount;
            let newP2WinCount = player2WinCount;
            
            if (selectedPlayer === 1) {
              newP1WinCount = Math.max(0, player1WinCount - 1);
              setPlayer1WinCount(newP1WinCount);
            } else {
              newP2WinCount = Math.max(0, player2WinCount - 1);
              setPlayer2WinCount(newP2WinCount);
            }

            const newGames = games.map(game => {
              let newGame = { ...game };
              
              if (selectedPlayer === 1 && game.p1Scores.length > 0) {
                const lastScore = game.p1Scores[game.p1Scores.length - 1];
                const newP1Scores = game.p1Scores.slice(0, -1);
                
                if (game.winner === 1) {
                  const boxBonus = calculateBoxBonus(game.p1Scores, game.p2Scores);
                  let gameMoney = gameValue + boxBonus;
                  if (game.shutout) gameMoney *= 2;
                  
                  setPlayer1Balance(prev => prev - gameMoney);
                  setPlayer2Balance(prev => prev + gameMoney);
                  
                  newGame = {
                    ...game,
                    p1Score: game.p1Score - lastScore,
                    p1Scores: newP1Scores,
                    winner: null,
                    shutout: false
                  };
                } else {
                  newGame = {
                    ...game,
                    p1Score: game.p1Score - lastScore,
                    p1Scores: newP1Scores
                  };
                }
              } else if (selectedPlayer === 2 && game.p2Scores.length > 0) {
                const lastScore = game.p2Scores[game.p2Scores.length - 1];
                const newP2Scores = game.p2Scores.slice(0, -1);
                
                if (game.winner === 2) {
                  const boxBonus = calculateBoxBonus(game.p2Scores, game.p1Scores);
                  let gameMoney = gameValue + boxBonus;
                  if (game.shutout) gameMoney *= 2;
                  
                  setPlayer2Balance(prev => prev - gameMoney);
                  setPlayer1Balance(prev => prev + gameMoney);
                  
                  newGame = {
                    ...game,
                    p2Score: game.p2Score - lastScore,
                    p2Scores: newP2Scores,
                    winner: null,
                    shutout: false
                  };
                } else {
                  newGame = {
                    ...game,
                    p2Score: game.p2Score - lastScore,
                    p2Scores: newP2Scores
                  };
                }
              }
              
              return newGame;
            });

            setGames(newGames);
          };

          const startNewRound = () => {
            setGames([
              { id: 1, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false },
              { id: 2, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false },
              { id: 3, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false }
            ]);
            setHandCount(0);
            setScoreInput('');
            setPlayer1WinCount(0);
            setPlayer2WinCount(0);
            setLastWinner(null);
          };

          const resetAll = () => {
            setGames([
              { id: 1, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false },
              { id: 2, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false },
              { id: 3, p1Score: 0, p2Score: 0, p1Scores: [], p2Scores: [], winner: null, shutout: false }
            ]);
            setHandCount(0);
            setScoreInput('');
            setPlayer1Balance(0);
            setPlayer2Balance(0);
            setPlayer1WinCount(0);
            setPlayer2WinCount(0);
            setLastWinner(null);
          };

          const saveBalances = () => {
            setPlayer1Balance(parseFloat(tempP1Balance) || 0);
            setPlayer2Balance(parseFloat(tempP2Balance) || 0);
            setEditingBalances(false);
          };

          const completedGames = games.filter(g => g.winner).length;
          const allGamesComplete = completedGames === 3;

          return (
            <div className="min-h-screen bg-neutral-900 p-4">
              <div className="max-w-5xl mx-auto">
                <div className="bg-white rounded-xl shadow-xl overflow-hidden">
                  <div className="bg-gradient-to-r from-neutral-800 to-neutral-700 px-6 py-5 flex justify-between items-center border-b border-neutral-600">
                    <div>
                      <h1 className="text-2xl font-light tracking-wide text-white">Hollywood Gin Rummy</h1>
                      <p className="text-neutral-300 text-sm mt-1">
                        Hand {handCount} • {completedGames} of 3 Complete
                        {lastWinner && handCount > 0 && (
                          <span className="ml-3 text-amber-400">
                            Last: {lastWinner === 1 ? player1Name : player2Name}
                          </span>
                        )}
                      </p>
                    </div>
                    <button
                      onClick={() => setShowSettings(!showSettings)}
                      className="p-2 text-neutral-300 hover:text-white transition-colors"
                    >
                      <Settings size={22} />
                    </button>
                  </div>

                  <div className="p-6">
                    <div className="bg-neutral-50 border border-neutral-200 rounded-lg p-5 mb-6">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-sm font-medium text-neutral-600 uppercase tracking-wider">Session Balance</h3>
                        {!editingBalances && (
                          <button
                            onClick={() => {
                              setTempP1Balance(player1Balance.toString());
                              setTempP2Balance(player2Balance.toString());
                              setEditingBalances(true);
                            }}
                            className="text-xs text-neutral-500 hover:text-neutral-700 uppercase tracking-wider"
                          >
                            Adjust
                          </button>
                        )}
                      </div>
                      
                      {editingBalances ? (
                        <div className="space-y-3">
                          <div className="flex items-center gap-3">
                            <span className="text-sm font-medium text-neutral-700 w-28">{player1Name}</span>
                            <input
                              type="number"
                              step="0.01"
                              value={tempP1Balance}
                              onChange={(e) => setTempP1Balance(e.target.value)}
                              className="flex-1 px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                            />
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="text-sm font-medium text-neutral-700 w-28">{player2Name}</span>
                            <input
                              type="number"
                              step="0.01"
                              value={tempP2Balance}
                              onChange={(e) => setTempP2Balance(e.target.value)}
                              className="flex-1 px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                            />
                          </div>
                          <button
                            onClick={saveBalances}
                            className="w-full py-2 bg-neutral-800 text-white text-sm rounded-md hover:bg-neutral-700 transition-colors"
                          >
                            Save Changes
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-2 gap-6">
                          <div className="text-center">
                            <div className="text-sm text-neutral-600 mb-1">{player1Name}</div>
                            <div className={`text-3xl font-light tabular-nums ${player1Balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                              ${Math.abs(player1Balance).toFixed(2)}
                            </div>
                            <div className="text-xs text-neutral-500 mt-1">{player1WinCount} hands</div>
                          </div>
                          <div className="text-center border-l border-neutral-200">
                            <div className="text-sm text-neutral-600 mb-1">{player2Name}</div>
                            <div className={`text-3xl font-light tabular-nums ${player2Balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                              ${Math.abs(player2Balance).toFixed(2)}
                            </div>
                            <div className="text-xs text-neutral-500 mt-1">{player2WinCount} hands</div>
                          </div>
                        </div>
                      )}
                    </div>

                    {allGamesComplete && (
                      <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-6 text-center">
                        <p className="font-medium text-amber-900">Round Complete</p>
                        <p className="text-sm text-amber-700 mt-1">Start a new round to continue</p>
                      </div>
                    )}

                    {showSettings && (
                      <div className="bg-neutral-50 border border-neutral-200 rounded-lg p-5 mb-6">
                        <h3 className="text-sm font-medium text-neutral-600 uppercase tracking-wider mb-4">Settings</h3>
                        <div className="grid grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs text-neutral-600 mb-1 uppercase tracking-wider">Winning Score</label>
                            <input
                              type="number"
                              value={winningScore}
                              onChange={(e) => setWinningScore(parseInt(e.target.value) || 100)}
                              className="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                            />
                          </div>
                          <div>
                            <label className="block text-xs text-neutral-600 mb-1 uppercase tracking-wider">Game Value</label>
                            <input
                              type="number"
                              step="0.01"
                              value={gameValue}
                              onChange={(e) => setGameValue(parseFloat(e.target.value) || 0)}
                              className="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                            />
                          </div>
                          <div>
                            <label className="block text-xs text-neutral-600 mb-1 uppercase tracking-wider">Box Value</label>
                            <input
                              type="number"
                              step="0.01"
                              value={boxValue}
                              onChange={(e) => setBoxValue(parseFloat(e.target.value) || 0)}
                              className="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                            />
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="flex gap-3 mb-6 items-center">
                      {editingNames ? (
                        <>
                          <input
                            type="text"
                            value={player1Name}
                            onChange={(e) => setPlayer1Name(e.target.value)}
                            className="flex-1 px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                          />
                          <input
                            type="text"
                            value={player2Name}
                            onChange={(e) => setPlayer2Name(e.target.value)}
                            className="flex-1 px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-neutral-400"
                          />
                          <button
                            onClick={() => setEditingNames(false)}
                            className="px-4 py-2 bg-neutral-800 text-white text-sm rounded-md hover:bg-neutral-700 transition-colors"
                          >
                            Done
                          </button>
                        </>
                      ) : (
                        <>
                          <div className="flex-1 text-center text-base font-medium text-neutral-800">{player1Name}</div>
                          <div className="flex-1 text-center text-base font-medium text-neutral-800">{player2Name}</div>
                          <button
                            onClick={() => setEditingNames(true)}
                            className="text-xs text-neutral-500 hover:text-neutral-700 uppercase tracking-wider px-2"
                          >
                            Edit
                          </button>
                        </>
                      )}
                    </div>

                    <div className="bg-neutral-50 border border-neutral-200 rounded-lg p-5 mb-6">
                      <div className="grid grid-cols-2 gap-3 mb-4">
                        <button
                          onClick={() => setSelectedPlayer(1)}
                          className={`py-2.5 px-4 rounded-md text-sm font-medium transition-all ${
                            selectedPlayer === 1
                              ? 'bg-neutral-800 text-white shadow-md'
                              : 'bg-white text-neutral-600 border border-neutral-300 hover:border-neutral-400'
                          }`}
                        >
                          {player1Name}
                        </button>
                        <button
                          onClick={() => setSelectedPlayer(2)}
                          className={`py-2.5 px-4 rounded-md text-sm font-medium transition-all ${
                            selectedPlayer === 2
                              ? 'bg-neutral-800 text-white shadow-md'
                              : 'bg-white text-neutral-600 border border-neutral-300 hover:border-neutral-400'
                          }`}
                        >
                          {player2Name}
                        </button>
                      </div>
                      
                      <div className="flex gap-3">
                        <input
                          type="number"
                          value={scoreInput}
                          onChange={(e) => setScoreInput(e.target.value)}
                          onKeyPress={(e) => e.key === 'Enter' && addScore()}
                          placeholder="Points"
                          className="flex-1 px-4 py-2.5 border border-neutral-300 rounded-md focus:outline-none focus:ring-2 focus:ring-neutral-400"
                        />
                        <button
                          onClick={addScore}
                          className="px-6 py-2.5 bg-neutral-800 text-white rounded-md hover:bg-neutral-700 transition-colors flex items-center gap-2 text-sm font-medium"
                        >
                          <Plus size={18} />
                          Add
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3 mb-6">
                      <button
                        onClick={undoLastScore}
                        className="py-2.5 px-4 bg-white border border-neutral-300 text-neutral-700 rounded-md hover:bg-neutral-50 transition-colors flex items-center justify-center gap-2 text-sm"
                      >
                        <Minus size={16} />
                        Undo
                      </button>
                      <button
                        onClick={startNewRound}
                        className="py-2.5 px-4 bg-white border border-neutral-300 text-neutral-700 rounded-md hover:bg-neutral-50 transition-colors text-sm"
                      >
                        New Round
                      </button>
                      <button
                        onClick={resetAll}
                        className="py-2.5 px-4 bg-white border border-neutral-300 text-neutral-700 rounded-md hover:bg-neutral-50 transition-colors flex items-center justify-center gap-2 text-sm"
                      >
                        <RotateCcw size={16} />
                        Reset
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {games.map((game) => (
                        <div
                          key={game.id}
                          className={`border rounded-lg p-4 ${
                            game.winner
                              ? 'border-amber-400 bg-amber-50'
                              : 'border-neutral-200 bg-white'
                          }`}
                        >
                          <div className="flex justify-between items-center mb-4 pb-3 border-b border-neutral-200">
                            <h3 className="text-sm font-medium text-neutral-600 uppercase tracking-wider">
                              Game {game.id}
                            </h3>
                            {game.winner && (
                              <span className="text-xs text-amber-700 font-medium">
                                {game.shutout ? 'SHUTOUT' : 'COMPLETE'}
                              </span>
                            )}
                          </div>
                          
                          <div className="space-y-3 mb-4">
                            <div className={`flex justify-between items-center p-3 rounded-md ${
                              game.winner === 1 ? 'bg-amber-100 border border-amber-300' : 'bg-neutral-50'
                            }`}>
                              <span className="text-sm text-neutral-700">{player1Name}</span>
                              <span className="text-2xl font-light tabular-nums text-neutral-900">{game.p1Score}</span>
                            </div>
                            
                            <div className={`flex justify-between items-center p-3 rounded-md ${
                              game.winner === 2 ? 'bg-amber-100 border border-amber-300' : 'bg-neutral-50'
                            }`}>
                              <span className="text-sm text-neutral-700">{player2Name}</span>
                              <span className="text-2xl font-light tabular-nums text-neutral-900">{game.p2Score}</span>
                            </div>
                          </div>

                          {(game.p1Scores.length > 0 || game.p2Scores.length > 0) && (
                            <div className="pt-3 border-t border-neutral-200 text-xs text-neutral-500 space-y-1">
                              {game.p1Scores.length > 0 && (
                                <div>{player1Name}: {game.p1Scores.join(', ')}</div>
                              )}
                              {game.p2Scores.length > 0 && (
                                <div>{player2Name}: {game.p2Scores.join(', ')}</div>
                              )}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
